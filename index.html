<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tactics Autobattler</title>
    <link rel="stylesheet" href="/src/web/style.css" />
  </head>
  <body>
    <header>
      <h1>Tactics Autobattler <small>prototype</small></h1>
      <div class="controls">
        <label>Scenario <select id="scenario"></select></label>
        <label>Difficulty
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <label>Seed <input id="seed" type="number" value="1" min="0" title="Varies which battle you see, not who wins" /></label>
        <label>Speed
          <select id="speed">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
            <option value="4">4x</option>
          </select>
        </label>
        <button id="fight">Fight!</button>
        <button id="pause" class="secondary" hidden>Pause</button>
        <button id="back" class="secondary" hidden>Back to setup</button>
      </div>
    </header>
    <main>
      <section class="stage">
        <div id="turnbar" class="turnbar" aria-label="Turn order"></div>
        <div class="board-wrap"><canvas id="board"></canvas><div id="banner" class="banner" hidden></div></div>
        <p id="hint" class="hint"></p>
      </section>
      <aside class="side">
        <div id="setup-panel">
          <h2>Scouting report</h2>
          <p id="scouting" class="scouting"></p>
          <ul id="enemies" class="roster enemy"></ul>
          <h2>Your company</h2>
          <ul id="roster" class="roster"></ul>
        </div>
        <div id="battle-panel" hidden>
          <h2>Battle log</h2>
          <div id="log" class="log"></div>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
